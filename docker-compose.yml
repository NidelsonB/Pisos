services:
  pisos-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: pisos-las-delicias:local
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      ADMIN_SESSION_TOKEN: pisos-las-delicias-admin-session
    volumes:
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
